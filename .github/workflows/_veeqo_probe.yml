name: TEMP Veeqo probe
on:
  push:
    branches: [claude/inspiring-maxwell-qw21hs]
    paths: ['veeqo_probe/**', '.github/workflows/_veeqo_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary
      - env:
          VEEQO_API_KEY: ${{ secrets.VEEQO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python veeqo_probe/probe.py
