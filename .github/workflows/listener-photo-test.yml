# TEMPORARY — delete before merging. Posts [TEST] photo alerts from this branch's code.
name: Listener photo alert test (temporary)

on:
  push:
    branches: [claude/ebay-listings-query-ta4stu]
    paths:
      - 'listener/**'
      - '.github/workflows/listener-photo-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Post [TEST] photo alerts
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m listener.photo_alert_test
