name: Analytics daily ingest

on:
  # Triggered twice daily — 11:00 UTC (3am PST) and 20:00 UTC (12pm PST) — by cron-job.org via workflow_dispatch
  workflow_dispatch:
  push:
    paths:
      - 'traffic_analytics/**'
      - 'traffic_dashboard/**'
      - 'shared/**'
      - 'public_listings/**'

permissions:
  contents: write

# One run at a time: overlapping runs double-spend the eBay Analytics daily quota and race on the git push.
concurrency:
  group: analytics-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # Code pushes only re-run compute + dashboard generation from data already in the DB;
      # the eBay fetches run on the nightly workflow_dispatch so pushes don't burn API quota.
      - name: Fetch from eBay APIs
        if: github.event_name != 'push'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN_READ }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m traffic_analytics.run_ingest

      - name: Fetch billing activity (fees)
        if: github.event_name != 'push'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN_READ }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m traffic_analytics.fetch_finances

      # Non-blocking: a Veeqo outage or bug here must never stop compute/dashboard or the chained
      # P&L ingest (which only runs when this workflow concludes "success"). Bounded so a hang
      # can't eat the job's 30-minute budget. Failures are surfaced by the warning step below.
      - name: Fetch Veeqo shipping labels
        id: veeqo
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        env:
          VEEQO_API_KEY: ${{ secrets.VEEQO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m traffic_analytics.fetch_veeqo_labels

      - name: Warn if Veeqo import failed
        if: steps.veeqo.outcome == 'failure'
        run: echo "::warning title=Veeqo label import failed::Shipping labels were NOT imported this run. The rest of the ingest ran normally. Check the 'Fetch Veeqo shipping labels' step log; the next run's 14-day lookback will catch up."

      # Non-blocking: the shared view-only listings sheet must never stop the traffic/P&L chain.
      # Reads listing_metadata only (just refreshed by sync_listings above); skips if the sheet secret is unset.
      - name: Update public listings sheet
        id: public_sheet
        # Only main publishes: a branch push must never change what viewers of the shared sheet see.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PUBLIC_LISTINGS_SHEET_ID: ${{ secrets.PUBLIC_LISTINGS_SHEET_ID }}
        run: python -m public_listings.sync_public_sheet

      - name: Warn if public listings sheet failed
        if: steps.public_sheet.outcome == 'failure'
        run: echo "::warning title=Public listings sheet not updated::Check the 'Update public listings sheet' step log. The rest of the ingest ran normally."

      - name: Compute metrics
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m traffic_analytics.compute_metrics

      - name: Generate traffic dashboard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m traffic_dashboard.generate_dashboard

      - name: Commit traffic_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/traffic/traffic_data.json
          git diff --staged --quiet || git commit -m "chore: traffic dashboard snapshot $(date +%Y-%m-%d)"
          git pull --rebase
          git push
